<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#142238">
  <title>Our Story | Kahfi & Ririn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="photobooth">
    <section class="camera-stage" aria-label="Photobooth Kahfi dan Ririn">
      <video id="camera" autoplay playsinline muted></video>
      <img id="preview" alt="Hasil foto" hidden>
      <img id="frame" src="assets/our-story-frame.png" alt="Bingkai Kahfi dan Ririn">

      <div class="camera-controls">
        <button id="savePhoto" class="round-control side-control" type="button"
                aria-label="Simpan foto" title="Simpan foto" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-5-5 5 5 5-5M5 20h14"/></svg>
        </button>
        <button id="capture" class="shutter" type="button" aria-label="Ambil foto" title="Ambil foto">
          <span></span>
        </button>
        <button id="switchCamera" class="round-control side-control" type="button"
                aria-label="Ganti kamera" title="Ganti kamera">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 7v5h-5M4 17v-5h5"/>
            <path d="M5.6 9A7 7 0 0 1 18 6.5L20 12M4 12l2 5.5A7 7 0 0 0 18.4 15"/>
          </svg>
        </button>
        <button id="retakePhoto"
        class="round-control side-control"
        type="button"
        aria-label="Foto ulang"
        title="Foto ulang"
        hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M3 12a9 9 0 1 0 2.64-6.36L3 8"/>
    <path d="M3 3v5h5"/>
  </svg>
</button>
      </div>
      <p id="status" class="status" role="status">Meminta akses kamera...</p>
    </section>
    <canvas id="photoCanvas" hidden></canvas>
  </main>
  <script src="script.js"></script>
</body>
</html>
